# LICSYS Next on LocalStack. `docker compose up --build` from modern/.
x-aws: &aws
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_REGION: ap-southeast-2
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
services:
  localstack:
    image: localstack/localstack:3.8
    ports: ["4566:4566"]
    environment:
      SERVICES: dynamodb,events,sqs
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal --region ap-southeast-2 sqs get-queue-url --queue-name activity-inbox"]
      interval: 5s
      retries: 30
  licence-service:
    build:
      context: ./licence-service
      args: { MAVEN_MIRROR_URL: "${MAVEN_MIRROR_URL:-}" }
    ports: ["8081:8081"]
    environment: *aws
    depends_on: { localstack: { condition: service_healthy } }
  demerit-service:
    build:
      context: ./demerit-service
      args: { MAVEN_MIRROR_URL: "${MAVEN_MIRROR_URL:-}" }
    ports: ["8082:8082"]
    environment: *aws
    depends_on: { localstack: { condition: service_healthy } }
  registration-service:
    build:
      context: ./registration-service
      args: { MAVEN_MIRROR_URL: "${MAVEN_MIRROR_URL:-}" }
    ports: ["8083:8083"]
    environment: *aws
    depends_on: { localstack: { condition: service_healthy } }
  notification-service:
    build:
      context: ./notification-service
      args: { MAVEN_MIRROR_URL: "${MAVEN_MIRROR_URL:-}" }
    ports: ["8084:8084"]
    environment: *aws
    depends_on: { localstack: { condition: service_healthy } }
  ui:
    build: ./ui
    ports: ["5173:5173"]
    depends_on: [licence-service, demerit-service, registration-service, notification-service]
